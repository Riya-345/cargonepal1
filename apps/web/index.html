<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#1f42eb" />

    <!-- Primary SEO -->
    <title>CargoNepal — Instant Bike Courier & Parcel Delivery in Nepal</title>
    <meta
      name="description"
      content="CargoNepal is a parcel-first instant bike courier platform for Nepal. Book a rider in seconds, track your parcel live on the map, and pay with Khalti, eSewa, Fonepay or Cash on Delivery. Fast. Safe. Parcel First."
    />
    <meta name="keywords" content="courier Nepal, parcel delivery Kathmandu, bike courier, instant delivery, CargoNepal, COD delivery Nepal, eSewa, Khalti" />
    <meta name="author" content="CargoNepal" />
    <link rel="canonical" href="https://cargonepal.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CargoNepal" />
    <meta property="og:title" content="CargoNepal — Fast. Safe. Parcel First." />
    <meta property="og:description" content="Instant bike courier delivery across Nepal. Book a parcel, track it live, pay digitally or on delivery." />
    <meta property="og:url" content="https://cargonepal.com/" />
    <meta property="og:image" content="https://cargonepal.com/og-cover.png" />
    <meta property="og:locale" content="en_NP" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CargoNepal — Fast. Safe. Parcel First." />
    <meta name="twitter:description" content="Instant bike courier delivery across Nepal." />
    <meta name="twitter:image" content="https://cargonepal.com/og-cover.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "CargoNepal",
        "description": "Instant bike courier and parcel delivery platform for Nepal.",
        "slogan": "Fast. Safe. Parcel First.",
        "areaServed": ["Kathmandu", "Lalitpur", "Bhaktapur", "Pokhara", "Biratnagar"],
        "address": { "@type": "PostalAddress", "addressCountry": "NP", "addressLocality": "Kathmandu" },
        "priceRange": "NPR"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
